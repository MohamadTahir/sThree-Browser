version: 2

# Version updates come once a month, minor and patch bumps grouped into one
# PR per ecosystem so lockfile edits don't conflict. Major bumps stay one per
# PR since each may need migration work. Security fixes don't wait for the
# schedule; they are grouped per ecosystem too, instead of one PR per package.

updates:
  # Web and desktop front end (pnpm uses the npm ecosystem).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # Tauri shell.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # Base images in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns: ["*"]

  # Pinned action SHAs in the release workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
