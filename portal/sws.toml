# static-web-server config for the portal image. Its policy is stricter than
# the app's: no inline scripts or styles, and the only third party allowed is
# Cloudflare Web Analytics (cookieless visit counts, see legal.html). Keep in
# step with _headers (Cloudflare Pages).

[general]
host = "::"
port = 8080
root = "/public"
log-level = "warn"

directory-listing = false
ignore-hidden-files = true
compression = true
health = true

cache-control-headers = false
security-headers = false

[advanced]

[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Cross-Origin-Opener-Policy = "same-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/fonts/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"
