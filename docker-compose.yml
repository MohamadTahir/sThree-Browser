version: '3.8'

services:
  s3-browser:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    restart: unless-stopped
    environment:
      # static-web-server environment variables
      - SERVER_PORT=8888
      - SERVER_ROOT=/public
      - SERVER_BASE_PATH=/
    # Run as nobody user (UID 65534, GID 65534 in Alpine)
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Drop all capabilities (port 8888 doesn't require root)
    cap_drop:
      - ALL
    # Note: read_only is set to false because static-web-server may need write access
    # Consider mounting /public as read-only volume if needed
